
<!DOCTYPE html>
<html>
<head>
    <title>CSS Demonstration</title>

    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 18px;
        }

        h3 {
            background-color: lightyellow;
            border: 2px solid orange;
            padding: 10px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Demonstration</h1>

    <!-- Inline CSS -->
    <h2 style="color: red; text-align: center;">
        Inline CSS Example
    </h2>

    <p>This paragraph uses internal CSS.</p>

    <h3>This heading uses internal CSS.</h3>

    <h4 class="external">External CSS Example</h4>

    <p style="color: purple;">
        This paragraph uses inline CSS.
    </p>

</body>
</html>
